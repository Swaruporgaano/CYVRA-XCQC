name: Monorepo CI

on:
  push:
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm install
      - run: npm run build
  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build apps/agent-windows/Xcqc.Agent.sln -c Release
