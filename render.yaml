# CYVRA XCQC — Render Blueprint
# P0: set DATABASE_URL (Neon pooled) + XCQC_INGEST_TOKEN in Render dashboard.
# See docs/P0-VERIFICATION-CHECKLIST.md

services:
  - type: web
    name: xcqc-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build -w @cyvra/xcqc-shared && npm run build -w @cyvra/xcqc-api
    startCommand: npm run start -w @cyvra/xcqc-api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: XCQC_INGEST_TOKEN
        sync: false
      # P0 — Neon pooled connection string (Neon takes precedence over XCQC_STORE)
      - key: DATABASE_URL
        sync: false
      # L2+ — generate in dashboard; see .env.example
      - key: JWT_SECRET
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: LICENSE_PEPPER
        sync: false
