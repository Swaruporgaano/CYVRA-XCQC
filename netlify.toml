[build]
  # Monorepo: install and workspace builds must run from repo root (-w requires root package.json).
  base = "."
  command = "npm install && npm run build -w @cyvra/xcqc-shared && npm run build -w @cyvra/xcqc-web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Set VITE_API_URL to https://<your-render-api>.onrender.com in Netlify env.
